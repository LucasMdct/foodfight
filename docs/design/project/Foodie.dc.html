<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:180,&quot;height&quot;:220},&quot;who&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;alface&quot;,&quot;feijao&quot;,&quot;arroz&quot;,&quot;vilao&quot;,&quot;vilao2&quot;,&quot;vilao3&quot;],&quot;default&quot;:&quot;alface&quot;,&quot;tsType&quot;:&quot;'alface'|'feijao'|'arroz'|'vilao'|'vilao2'|'vilao3'&quot;,&quot;section&quot;:&quot;Personagem&quot;},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;feliz&quot;,&quot;bravo&quot;],&quot;default&quot;:&quot;feliz&quot;,&quot;tsType&quot;:&quot;'feliz'|'bravo'&quot;,&quot;section&quot;:&quot;Personagem&quot;},&quot;talking&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Personagem&quot;},&quot;skin&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;cartola&quot;,&quot;coroa&quot;,&quot;oculos&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;'none'|'cartola'|'coroa'|'oculos'&quot;,&quot;section&quot;:&quot;Personagem&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const who = this.props.who ?? 'alface';
    const mood = this.props.mood ?? 'feliz';
    const VIL = {
      vilao:  { body: '#4A2C17', body2: '#6B4226', cup: '#D94F4F', cupD: '#B93E3E', hat: 'cartola' },
      vilao2: { body: '#F06BAF', body2: '#F78CC3', cup: '#9B5DE5', cupD: '#7E44C4', hat: 'coroa' },
      vilao3: { body: '#6FB9E8', body2: '#93CDF2', cup: '#C89A6B', cupD: '#A9723F', hat: 'cone' },
    };
    const isVil = !!VIL[who];
    const v = VIL[who] || VIL.vilao;
    const skin = this.props.skin ?? 'none';
    return {
      vilBody: v.body, vilBody2: v.body2, vilCup: v.cup, vilCupD: v.cupD,
      hatCartola: v.hat === 'cartola', hatCoroa: v.hat === 'coroa', hatCone: v.hat === 'cone',
      skinCartola: !isVil && skin === 'cartola',
      skinCoroa: !isVil && skin === 'coroa',
      skinOculos: !isVil && skin === 'oculos',
      vilFeliz: isVil && mood !== 'bravo',
      vilBravo: isVil && mood === 'bravo',
      mouthFeliz: isVil && mood !== 'bravo' && !this.props.talking,
      mouthBravo: isVil && mood === 'bravo' && !this.props.talking,
      vilTalking: isVil && !!this.props.talking,
      isAlface: who === 'alface',
      isFeijao: who === 'feijao',
      isArroz: who === 'arroz',
      isVilao: isVil,
    };
  }
}
</script>
